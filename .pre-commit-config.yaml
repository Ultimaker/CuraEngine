# @generated by the agentic bootstrap. Regenerated on every run; the absence
# of this header is how the writer recognises a hand-written file and refuses
# to overwrite it. Edit the bootstrap, not this file.
default_stages: [pre-commit]
# Keep this exclude narrow: it exempts matching paths from EVERY hook. A broad
# entry (e.g. `software/.*`) has excluded >99% of a tree from every gate.
# Generation fails if this pattern matches more than half of tracked files.
exclude: "^(vendor/.*|third_party/.*|node_modules/.*|build/.*)"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: '^(.*/tsconfig[^/]*\.json|tsconfig[^/]*\.json|.*/jsconfig[^/]*\.json|jsconfig[^/]*\.json|.*\.vscode/.*\.json|\.vscode/.*\.json)'
      # Never tightened silently: when the repository already set a ceiling, that
      # ceiling is carried forward. A bootstrap that quietly dropped a repo from
      # 40000 KB to 2000 KB starts blocking assets that were fine yesterday, and
      # the diff gives no clue why.
      - id: check-added-large-files
        args: ['--maxkb=2000']
      # MUTATING HOOKS ARE SCOPED TO THE BOOTSTRAP'S OWN OUTPUT.
      # These two rewrite the files they inspect. Unscoped, a single
      # `pre-commit run --all-files` — which agents run as verification —
      # reformatted 190 files in one repository and 189 in another, and that
      # churn landed in pull requests about something else entirely. The
      # bootstrap introduces these hooks; the repository never asked for them;
      # so they police what the bootstrap writes and nothing else. Repo-wide
      # formatting stays the repository's own decision, in its own config.
      - id: end-of-file-fixer
        files: '^(\.agents/|\.claude/|\.opencode/|\.github/hooks/|\.github/copilot-|AGENTS\.md$|GEMINI\.md$|DESIGN\.md$|\.aiignore$|\.ignore$|\.gitattributes$|\.talismanrc$|opencode\.json$|\.pre-commit-config\.yaml$|scripts/(sync_agentic_configs|verify_and_create_pr)\.sh$)'
      - id: trailing-whitespace
        files: '^(\.agents/|\.claude/|\.opencode/|\.github/hooks/|\.github/copilot-|AGENTS\.md$|GEMINI\.md$|DESIGN\.md$|\.aiignore$|\.ignore$|\.gitattributes$|\.talismanrc$|opencode\.json$|\.pre-commit-config\.yaml$|scripts/(sync_agentic_configs|verify_and_create_pr)\.sh$)'

  - repo: https://github.com/thoughtworks/talisman
    rev: v1.32.0
    hooks:
      - id: talisman-commit
        entry: talisman --githook pre-commit

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      # Check mode, for the same reason as black above.
      - id: clang-format
        args: [--dry-run, -Werror]
        types_or: [c++, c]
        exclude: '^\.agents/'

  - repo: local
    hooks:

      - id: check-ast-grep
        name: Check changed C++ lines against CuraEngine structural rules
        entry: python .agents/hooks/check_ast_grep.py
        language: python
        additional_dependencies: ['ast-grep-cli==0.45.1']
        types_or: [c++, c]

      - id: test-ast-grep-rules
        name: Verify CuraEngine structural rule fixtures
        entry: python .agents/hooks/test_check_ast_grep.py
        language: python
        additional_dependencies: ['ast-grep-cli==0.45.1']
        files: '^(sgconfig\.yml|rules/cpp/|\.agents/hooks/(check_ast_grep|test_check_ast_grep)\.py)'
        pass_filenames: false

      - id: block-absolute-paths
        name: Block absolute local path references
        entry: python .agents/hooks/block-absolute-paths.py
        language: system
        types_or: [text]

      - id: block-secrets
        name: Detect hardcoded API keys and credentials
        entry: python .agents/hooks/block-secrets.py
        language: system
        types_or: [text]

      - id: check-aiignore-sync
        name: Verify AI exclusion targets match .aiignore
        entry: python .agents/hooks/compile_aiignore.py --check
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-rule-frontmatter
        name: Enforce rule numbering bands, frontmatter coherence and managed-space ownership
        entry: python .agents/hooks/compile_rule_frontmatter.py --check
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-copilot-rule-index
        name: Verify the Copilot rule index lists every rule in .agents/rules
        entry: python .agents/hooks/copilot_index.py --check
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-file-size-budget
        name: Enforce file size budget and grandfathering ratchet
        entry: python .agents/hooks/check_file_size_budget.py --staged
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-complexity-budget
        name: Enforce cyclomatic complexity budget on changed code
        entry: python .agents/hooks/check_complexity.py --staged
        language: python
        additional_dependencies: ['lizard==1.24.0']
        pass_filenames: false
        types_or: [text]

      - id: audit-quad-agent-parity
        name: Verify 100% parity across Quad-Agent configuration targets
        entry: python .agents/hooks/audit_quad_agent_parity.py
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-security-downgrades
        name: Prevent disabling pre-commit hooks or Talisman credentials scanning
        entry: python .agents/hooks/check_security_downgrades.py
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-upstream-alignment
        name: Verify alignment with upstream release branches
        entry: python .agents/hooks/check_upstream_alignment.py
        language: system
        pass_filenames: false
        types_or: [text]

      - id: check-multi-intent-scope
        name: Detect multi-intent PRs mixing features with refactoring
        entry: python .agents/hooks/check_multi_intent_scope.py
        language: system
        types_or: [text]
